<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>BHBĐHub</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BHBĐHub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#0a3d91;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;padding-top:env(safe-area-inset-top)}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:16px/1.5 system-ui,sans-serif;background:#0a3d91;z-index:2}
#ld i{width:34px;height:34px;border:4px solid rgba(255,255,255,.3);border-top-color:#ffd54a;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:12px}@keyframes sp{to{transform:rotate(360deg)}}
#e{display:none;position:fixed;left:0;right:0;bottom:0;z-index:3;background:#0a3d91;color:#fff;font:14px/1.5 system-ui,sans-serif;padding:10px 16px}
#e a,#e button{color:#ffd54a;background:none;border:0;font:inherit;text-decoration:underline;padding:0 6px}
</style>
</head>
<body>
<div id="ld"><i></i>Đang mở BHBĐHub…</div>
<iframe id="f" allow="clipboard-write; fullscreen" referrerpolicy="origin"></iframe>
<div id="e"></div>
<script>
var APP_URL='https://script.google.com/macros/s/AKfycbyM1PiI8ss8-QOFQ4kLlSz6lfCXo5zH4pNIr_e4YZyZ7-VX7tbYYCCuahXHOI5dpzRGNw/exec';
(function(){
var f=document.getElementById('f'),e=document.getElementById('e'),ld=document.getElementById('ld'),t=null,n=0;
function go(){
 n++;e.style.display='none';ld.style.display='flex';
 f.src=APP_URL+(APP_URL.indexOf('?')<0?'?':'&')+'embed=1&v='+Date.now();
 clearTimeout(t);
 /* Apps Script khởi động chậm: chờ 25 giây rồi mới hiện nút Tải lại (KHÔNG tự mở sang link khác) */
 t=setTimeout(function(){
  e.style.display='block';
  e.innerHTML='Mở lâu hơn bình thường. <button id="rl">Tải lại</button> · <a href="'+APP_URL+'" target="_blank" rel="noopener">mở trong tab mới</a>';
  document.getElementById('rl').onclick=go;
 },25000);
}
f.addEventListener('load',function(){clearTimeout(t);e.style.display='none';setTimeout(function(){ld.style.display='none'},400)});
go();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
